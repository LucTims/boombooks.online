<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-penser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="50%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </linearGradient>
    <linearGradient id="book-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1877F2" />
      <stop offset="100%" stop-color="#0B4FB3" />
    </linearGradient>
    <linearGradient id="glow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow-book" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background base with soft curved backdrop -->
  <rect width="600" height="420" fill="url(#bg-penser)" rx="20" />
  <circle cx="300" cy="180" r="140" fill="#FFFFFF" opacity="0.75" />
  <circle cx="300" cy="170" r="110" fill="url(#glow-gold)" opacity="0.35" />

  <!-- Radiating knowledge rays -->
  <g stroke="#93C5FD" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <line x1="300" y1="50" x2="300" y2="75" />
    <line x1="220" y1="70" x2="235" y2="90" />
    <line x1="380" y1="70" x2="365" y2="90" />
    <line x1="160" y1="120" x2="185" y2="135" />
    <line x1="440" y1="120" x2="415" y2="135" />
  </g>

  <!-- Floating wisdom stars/particles -->
  <polygon points="300,78 304,88 314,92 304,96 300,106 296,96 286,92 296,88" fill="url(#gold-accent)" />
  <polygon points="210,120 212,126 218,128 212,130 210,136 208,130 202,128 208,126" fill="url(#gold-accent)" opacity="0.9" />
  <polygon points="390,115 392,121 398,123 392,125 390,131 388,125 382,123 388,121" fill="url(#gold-accent)" opacity="0.9" />

  <!-- Central Open Book (Symbole de la lecture et du changement de mentalité) -->
  <g filter="url(#shadow-book)">
    <!-- Book cover/base -->
    <path d="M 170,270 Q 300,295 300,240 Q 300,295 430,270 L 435,260 Q 300,285 300,230 Q 300,285 165,260 Z" fill="#0F172A" opacity="0.4" />
    
    <!-- Left page stack -->
    <path d="M 170,260 Q 235,245 300,248 L 300,165 Q 235,160 170,175 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <path d="M 174,256 Q 237,242 300,245 L 300,162 Q 237,157 174,172 Z" fill="#FFFFFF" />
    
    <!-- Right page stack -->
    <path d="M 430,260 Q 365,245 300,248 L 300,165 Q 365,160 430,175 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <path d="M 426,256 Q 363,242 300,245 L 300,162 Q 363,157 426,172 Z" fill="#FFFFFF" />

    <!-- Spine accent in BoomBooks Blue -->
    <path d="M 296,163 L 304,163 L 304,249 L 296,249 Z" fill="url(#book-grad)" />

    <!-- Stylized page lines / knowledge text -->
    <g stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <line x1="200" y1="190" x2="270" y2="183" />
      <line x1="200" y1="205" x2="270" y2="198" />
      <line x1="200" y1="220" x2="250" y2="215" />

      <line x1="330" y1="183" x2="400" y2="190" />
      <line x1="330" y1="198" x2="400" y2="205" />
      <line x1="330" y1="213" x2="380" y2="218" />
    </g>

    <!-- Glowing lightbulb/flame rising from the center (Illumination) -->
    <circle cx="300" cy="130" r="28" fill="#FFFFFF" filter="url(#shadow-book)" />
    <circle cx="300" cy="130" r="24" fill="url(#book-grad)" />
    <!-- Lightbulb icon in white -->
    <path d="M 294,142 L 306,142 M 296,145 L 304,145 M 292,130 C 292,125 296,120 300,120 C 304,120 308,125 308,130 C 308,134 305,136 304,138 L 296,138 C 295,136 292,134 292,130 Z" 
          stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Step badge in corner -->
  <g transform="translate(480, 28)">
    <rect width="90" height="32" rx="16" fill="#1877F2" />
    <text x="45" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.08em">01 · PENSER</text>
  </g>
</svg>