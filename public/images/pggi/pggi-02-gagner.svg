<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gagner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="curve-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="rocket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="shadow-gagner" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0369A1" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="600" height="420" fill="url(#bg-gagner)" rx="20" />
  <circle cx="320" cy="190" r="135" fill="#FFFFFF" opacity="0.75" />

  <!-- Background grid coordinate lines -->
  <g stroke="#E0F2FE" stroke-width="1.5" opacity="0.8">
    <line x1="80" y1="290" x2="520" y2="290" />
    <line x1="80" y1="230" x2="520" y2="230" />
    <line x1="80" y1="170" x2="520" y2="170" />
    <line x1="80" y1="110" x2="520" y2="110" />
  </g>

  <!-- Growing Bars (Compétences & Cashflow) -->
  <g filter="url(#shadow-gagner)">
    <rect x="140" y="240" width="44" height="60" rx="8" fill="#93C5FD" opacity="0.8" />
    <rect x="210" y="200" width="44" height="100" rx="8" fill="#60A5FA" opacity="0.9" />
    <rect x="280" y="150" width="44" height="150" rx="8" fill="#38BDF8" />
    <rect x="350" y="110" width="44" height="190" rx="8" fill="url(#curve-grad)" />
  </g>

  <!-- Dynamic Curved Growth Arrow -->
  <path d="M 120,270 Q 240,240 370,110 L 440,70" fill="none" stroke="url(#curve-grad)" stroke-width="8" stroke-linecap="round" filter="url(#shadow-gagner)" />
  
  <!-- Arrow Head -->
  <polygon points="440,55 455,80 430,82" fill="#0284C7" filter="url(#shadow-gagner)" />

  <!-- Floating Success & Skill Badges -->
  <!-- Cashflow badge -->
  <g transform="translate(390, 80)" filter="url(#shadow-gagner)">
    <circle cx="28" cy="28" r="28" fill="#0284C7" />
    <!-- Trending Up Icon -->
    <path d="M 18,34 L 25,26 L 31,31 L 40,20 M 40,20 L 33,20 M 40,20 L 40,27" 
          stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- High-value skills pill -->
  <g transform="translate(180, 85)" filter="url(#shadow-gagner)">
    <rect width="130" height="34" rx="17" fill="#FFFFFF" />
    <circle cx="18" cy="17" r="10" fill="#06B6D4" />
    <path d="M 14,17 L 17,20 L 22,14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="36" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#0F172A">+ REVENUS</text>
  </g>

  <!-- Sparkles -->
  <circle cx="470" cy="140" r="4" fill="#0284C7" opacity="0.8" />
  <circle cx="130" cy="180" r="3" fill="#06B6D4" opacity="0.7" />
  <circle cx="340" cy="70" r="5" fill="#38BDF8" opacity="0.8" />

  <!-- Step badge in corner -->
  <g transform="translate(470, 28)">
    <rect width="100" height="32" rx="16" fill="#0284C7" />
    <text x="50" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.08em">02 · GAGNER</text>
  </g>
</svg>