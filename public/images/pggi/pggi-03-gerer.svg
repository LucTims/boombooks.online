<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gerer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="50%" stop-color="#DCFCE7" />
      <stop offset="100%" stop-color="#BBF7D0" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold-coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow-gerer" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#047857" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="420" fill="url(#bg-gerer)" rx="20" />
  <circle cx="300" cy="185" r="140" fill="#FFFFFF" opacity="0.8" />

  <!-- Background decorative concentric rings -->
  <circle cx="300" cy="190" r="115" fill="none" stroke="#86EFAC" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />

  <!-- Shield of Financial Security (Fonds d'urgence & Protection) -->
  <g filter="url(#shadow-gerer)">
    <path d="M 300,90 Q 360,95 380,140 Q 380,220 300,265 Q 220,220 220,140 Q 240,95 300,90 Z" 
          fill="url(#shield-grad)" stroke="#FFFFFF" stroke-width="4" />
    <!-- Inner shield design -->
    <path d="M 300,105 Q 348,110 364,145 Q 364,208 300,248 Q 236,208 236,145 Q 252,110 300,105 Z" 
          fill="#FFFFFF" opacity="0.16" />

    <!-- Checkmark inside Shield -->
    <path d="M 275,175 L 292,192 L 328,155" 
          stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Coin stacks (Épargne structurée) -->
  <!-- Left stack -->
  <g transform="translate(145, 195)" filter="url(#shadow-gerer)">
    <ellipse cx="30" cy="80" rx="30" ry="12" fill="#D97706" />
    <rect x="0" y="65" width="60" height="15" fill="url(#gold-coin)" />
    <ellipse cx="30" cy="65" rx="30" ry="12" fill="url(#gold-coin)" />

    <rect x="0" y="50" width="60" height="15" fill="url(#gold-coin)" />
    <ellipse cx="30" cy="50" rx="30" ry="12" fill="url(#gold-coin)" />

    <rect x="0" y="35" width="60" height="15" fill="url(#gold-coin)" />
    <ellipse cx="30" cy="35" rx="30" ry="12" fill="url(#gold-coin)" />

    <rect x="0" y="20" width="60" height="15" fill="url(#gold-coin)" />
    <ellipse cx="30" cy="20" rx="30" ry="12" fill="#FEF08A" />
    <!-- FCFA Symbol / lock -->
    <text x="30" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#B45309" text-anchor="middle">CFA</text>
  </g>

  <!-- Right stack (Higher) -->
  <g transform="translate(395, 170)" filter="url(#shadow-gerer)">
    <ellipse cx="30" cy="105" rx="30" ry="12" fill="#D97706" />
    <rect x="0" y="90" width="60" height="15" fill="url(#gold-coin)" />
    <ellipse cx="30" cy="90" rx="30" ry="12" fill="url(#gold-coin)" />

    <rect x="0" y="75" width="60" height="15" fill="url(#gold-coin)" />
    <ellipse cx="30" cy="75" rx="30" ry="12" fill="url(#gold-coin)" />

    <rect x="0" y="60" width="60" height="15" fill="url(#gold-coin)" />
    <ellipse cx="30" cy="60" rx="30" ry="12" fill="url(#gold-coin)" />

    <rect x="0" y="45" width="60" height="15" fill="url(#gold-coin)" />
    <ellipse cx="30" cy="45" rx="30" ry="12" fill="url(#gold-coin)" />

    <rect x="0" y="30" width="60" height="15" fill="url(#gold-coin)" />
    <ellipse cx="30" cy="30" rx="30" ry="12" fill="#FEF08A" />
    <text x="30" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#B45309" text-anchor="middle">CFA</text>
  </g>

  <!-- Budget control badge at bottom -->
  <g transform="translate(210, 290)" filter="url(#shadow-gerer)">
    <rect width="180" height="34" rx="17" fill="#FFFFFF" />
    <circle cx="20" cy="17" r="10" fill="#10B981" />
    <path d="M 16,17 L 19,20 L 24,14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="40" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#065F46">0 DÉPENSE INUTILE</text>
  </g>

  <!-- Step badge in corner -->
  <g transform="translate(480, 28)">
    <rect width="90" height="32" rx="16" fill="#10B981" />
    <text x="45" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.08em">03 · GÉRER</text>
  </g>
</svg>