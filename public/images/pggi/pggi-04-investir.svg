<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-investir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2" />
      <stop offset="50%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FECDD3" />
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E41E3F" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="gold-brvm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow-investir" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#9F1239" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="600" height="420" fill="url(#bg-investir)" rx="20" />
  <circle cx="300" cy="180" r="140" fill="#FFFFFF" opacity="0.85" />

  <!-- Background Financial Grid -->
  <g stroke="#FECDD3" stroke-width="1.5" opacity="0.8">
    <line x1="80" y1="280" x2="520" y2="280" />
    <line x1="80" y1="220" x2="520" y2="220" />
    <line x1="80" y1="160" x2="520" y2="160" />
    <line x1="80" y1="100" x2="520" y2="100" />
  </g>

  <!-- Stock Market Candlesticks / Columns (BRVM) -->
  <g filter="url(#shadow-investir)">
    <!-- Column 1 -->
    <line x1="160" y1="200" x2="160" y2="280" stroke="#E41E3F" stroke-width="2" />
    <rect x="145" y="220" width="30" height="50" rx="4" fill="#FDA4AF" />

    <!-- Column 2 -->
    <line x1="220" y1="170" x2="220" y2="270" stroke="#16A34A" stroke-width="2" />
    <rect x="205" y="190" width="30" height="60" rx="4" fill="#86EFAC" />

    <!-- Column 3 (Breakout) -->
    <line x1="280" y1="130" x2="280" y2="250" stroke="#16A34A" stroke-width="2" />
    <rect x="265" y="150" width="30" height="80" rx="4" fill="#34D399" />

    <!-- Column 4 (BRVM Peak) -->
    <line x1="340" y1="80" x2="340" y2="220" stroke="#E41E3F" stroke-width="2.5" />
    <rect x="325" y="100" width="30" height="110" rx="4" fill="url(#red-grad)" />
  </g>

  <!-- Exponential Compounding Line -->
  <path d="M 120,270 Q 240,240 330,120 L 440,75" fill="none" stroke="url(#red-grad)" stroke-width="7" stroke-linecap="round" filter="url(#shadow-investir)" />
  <polygon points="440,63 455,83 432,88" fill="#E41E3F" filter="url(#shadow-investir)" />

  <!-- Central BRVM Stock / Wealth Badge -->
  <g transform="translate(370, 75)" filter="url(#shadow-investir)">
    <rect width="135" height="42" rx="21" fill="#FFFFFF" stroke="#E41E3F" stroke-width="2" />
    <circle cx="21" cy="21" r="14" fill="url(#red-grad)" />
    <!-- Bank/Stock icon -->
    <path d="M 15,18 L 21,14 L 27,18 M 16,19 L 16,24 M 21,19 L 21,24 M 26,19 L 26,24 M 14,25 L 28,25" 
          stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="44" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#9F1239">BRVM 100%</text>
  </g>

  <!-- Dividends Pill at bottom -->
  <g transform="translate(190, 290)" filter="url(#shadow-investir)">
    <rect width="220" height="38" rx="19" fill="#0B0F14" />
    <circle cx="22" cy="19" r="11" fill="url(#gold-brvm)" />
    <text x="22" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#78350F" text-anchor="middle">$</text>
    <text x="44" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" letter-spacing="0.05em">DIVIDENDES RÉGULIERS</text>
  </g>

  <!-- Sparkles -->
  <circle cx="130" cy="120" r="4" fill="#E41E3F" opacity="0.6" />
  <circle cx="470" cy="160" r="5" fill="#F43F5E" opacity="0.7" />

  <!-- Step badge in corner -->
  <g transform="translate(470, 28)">
    <rect width="100" height="32" rx="16" fill="#E41E3F" />
    <text x="50" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.08em">04 · INVESTIR</text>
  </g>
</svg>